<!-- templates/account/signup.html -->
{% extends "account/base.html" %}
{% block title %}Register — CarDetect AI{% endblock %}
{% block subtitle %}Create your account{% endblock %}

{% block content %}
  <form method="POST" action="{% url 'account_signup' %}" class="space-y-4">
    {% csrf_token %}
    <div>
      <label class="block text-sm text-gray-400 mb-1.5">Username</label>
      <input name="username" type="text" required placeholder="your_username"
        class="w-full bg-gray-800 text-white border border-gray-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-blue-500 transition"/>
    </div>
    <div>
      <label class="block text-sm text-gray-400 mb-1.5">Email</label>
      <input name="email" type="email" required placeholder="you@email.com"
        class="w-full bg-gray-800 text-white border border-gray-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-blue-500 transition"/>
    </div>
    <div>
      <label class="block text-sm text-gray-400 mb-1.5">Password</label>
      <input name="password1" type="password" required placeholder="••••••••"
        class="w-full bg-gray-800 text-white border border-gray-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-blue-500 transition"/>
    </div>
    <div>
      <label class="block text-sm text-gray-400 mb-1.5">Confirm Password</label>
      <input name="password2" type="password" required placeholder="••••••••"
        class="w-full bg-gray-800 text-white border border-gray-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-blue-500 transition"/>
    </div>
    <button type="submit"
      class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition">
      Create account
    </button>
  </form>

  <p class="text-center text-sm text-gray-500 mt-6">
    Already have an account?
    <a href="{% url 'account_login' %}" class="text-blue-400 hover:text-blue-300">Sign in</a>
  </p>
{% endblock %}
