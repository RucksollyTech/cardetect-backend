<!-- templates/account/base.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}CarDetect AI{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-950 flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-12 h-12 bg-blue-600 rounded-xl mb-4">
        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M5 17H3a2 2 0 01-2-2v-4a2 2 0 012-2h1l2-4h12l2 4h1a2 2 0 012 2v4a2 2 0 01-2 2h-2M7.5 17.5a2.5 2.5 0 100-5 2.5 2.5 0 000 5zM16.5 17.5a2.5 2.5 0 100-5 2.5 2.5 0 000 5z"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-white">CarDetect AI</h1>
      <p class="text-gray-400 text-sm mt-1">{% block subtitle %}{% endblock %}</p>
    </div>

    <div class="bg-gray-900 rounded-2xl p-8 border border-gray-800">
      {% if messages %}
        {% for message in messages %}
          <div class="mb-4 px-4 py-3 rounded-lg text-sm
            {% if message.tags == 'error' %}bg-red-500/10 text-red-400 border border-red-500/20
            {% else %}bg-blue-500/10 text-blue-400 border border-blue-500/20{% endif %}">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}
      {% block content %}{% endblock %}
    </div>
  </div>
</body>
</html>
